name: Build and deploy database

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out database
        uses: actions/checkout@v6

      - name: Check out shared renderer
        uses: actions/checkout@v6
        with:
          repository: obousquet/math_database
          ref: 68f9974ece83901e737abeb84d4d90472864c47d
          path: math_database

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install renderer dependencies
        run: python -m pip install -r math_database/requirements.txt

      - name: Validate database
        run: python scripts/validate_data.py --data-dir data

      - name: Build static website
        run: |
          python math_database/generate_website.py \
            --data_dir data \
            --output_dir docs \
            --deploy true
          touch docs/.nojekyll

      - name: Check generated website
        run: python scripts/check_generated_site.py --site-dir docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
